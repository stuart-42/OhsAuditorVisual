[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]   # line length enforced by formatter, not linter

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true   # fastapi stubs optional; tighten when stubs added

[tool.pytest.ini_options]
testpaths = ["tests"]
