name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api_requirements.txt
          pip install ruff mypy pytest pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy sitesentry/ tests/
      - name: Tests (pytest)
        run: pytest -q
      - name: Dependency audit (pip-audit)
        run: pip-audit || true   # report but don't block initially; tighten later
      - name: SAST (bandit)
        run: bandit -r . -ll || true

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app exists
        id: guard
        run: echo "exists=$(test -f app/pubspec.yaml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter
        if: steps.guard.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        if: steps.guard.outputs.exists == 'true'
        run: flutter pub get
        working-directory: app
      - name: Analyze
        if: steps.guard.outputs.exists == 'true'
        run: flutter analyze
        working-directory: app
      - name: Tests
        if: steps.guard.outputs.exists == 'true'
        run: flutter test
        working-directory: app

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
