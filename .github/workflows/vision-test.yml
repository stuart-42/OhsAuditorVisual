name: Vision Test

# Run the local vision prototype on GitHub's free runners (no AWS).
# Trigger manually from the Actions tab, or automatically when sample images change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prototype/vision_test/**"

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/vision_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run detection on sample images
        run: python detect.py --images sample_images --out outputs
      - name: Upload annotated results
        uses: actions/upload-artifact@v4
        with:
          name: vision-outputs
          path: prototype/vision_test/outputs/
          if-no-files-found: warn
